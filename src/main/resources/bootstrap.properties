debug=true

spring.application.name=stock-microservice
#Aplicación de configuración Config-Server
spring.cloud.config.uri=http://localhost:8888
management.endpoints.web.exposure.include=*
spring.cloud.config.profile=dev
spring.cloud.compatibility-verifier.enabled=false

# Configuración de Vault
spring.cloud.vault.application-name=stock-microservice
spring.cloud.vault.host=localhost
spring.cloud.vault.port=8200
spring.cloud.vault.scheme=http
spring.cloud.vault.authentication=token
# Credenciales de acceso en Secreto en GitHub Secrets - token de acceso personal
spring.cloud.vault.token=79201519-8e8c-477e-8d43-1b40a0c6ded5
spring.cloud.vault.enabled=true
spring.cloud.vault.kv.backend=secret


# Registrar los servicios con localhost en Eureka.
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost